<title>Devis ECO PUMP AFRIK</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: split workspace — editing panel (left) + live A4 document (right); document is always a white sheet in both themes */
:root{
  --brand:#1689c6; --brand-ink:#0d6699; --brand-soft:#e7f3fb;
  --app-bg:#eef2f6; --panel:#ffffff; --panel-2:#f6f9fc; --fg:#17242e; --muted:#5a6b78;
  --line:#d7e0e8; --input:#ffffff; --input-bd:#c7d3dd; --accent:#1689c6;
  --paper:#ffffff; --paper-fg:#1a2530; --paper-muted:#55646f; --paper-line:#c9d4dd;
  --ok:#1a8a52; --danger:#c0392b;
  --f-display:'Archivo',system-ui,sans-serif; --f-body:'Source Sans 3',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --app-bg:#10171d; --panel:#18222b; --panel-2:#141d24; --fg:#e7eef3; --muted:#9fb0bc;
  --line:#2a3842; --input:#101920; --input-bd:#33444f; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --app-bg:#10171d; --panel:#18222b; --panel-2:#141d24; --fg:#e7eef3; --muted:#9fb0bc;
  --line:#2a3842; --input:#101920; --input-bd:#33444f; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--app-bg);color:var(--fg);font-family:var(--f-body);line-height:1.45}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button{font-family:var(--f-body)}

.wrap{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:18px;
  padding-block:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  max-width:1500px;margin:0 auto}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}

/* ---- editing panel ---- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;align-self:start}
.panel h2{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-weight:700}
.seg{display:flex;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:16px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px;border-radius:7px;font-weight:700;cursor:pointer;font-size:.95rem}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:.74rem;font-weight:600;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}
.fld input,.fld textarea,.fld select{width:100%;background:var(--input);border:1px solid var(--input-bd);border-radius:8px;
  padding:8px 10px;color:var(--fg);font-size:.95rem;font-family:var(--f-body)}
.fld textarea{resize:vertical;min-height:38px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub{font-size:.72rem;color:var(--muted);margin:2px 0 10px}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}

.items{display:flex;flex-direction:column;gap:12px}
.item{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:11px}
.item .top{display:grid;grid-template-columns:52px 1fr 28px;gap:8px;align-items:center;margin-bottom:8px}
.item .top .ix{font-weight:800;color:var(--brand);font-family:var(--f-display)}
.item .grid3{display:grid;grid-template-columns:1fr 70px 1fr;gap:8px}
.item input{width:100%;background:var(--input);border:1px solid var(--input-bd);border-radius:7px;padding:6px 8px;color:var(--fg);font-size:.88rem}
.item .lbl{font-size:.68rem;color:var(--muted);margin-bottom:3px;display:block}
.del{border:1px solid var(--input-bd);background:transparent;color:var(--danger);border-radius:7px;cursor:pointer;height:30px;font-size:1rem;line-height:1}
.addbtn{margin-top:4px;border:1px dashed var(--brand);color:var(--brand);background:transparent;border-radius:9px;padding:10px;font-weight:700;cursor:pointer;width:100%}
.tools{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.tools button{flex:1;min-width:120px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);border-radius:9px;padding:10px;font-weight:600;cursor:pointer}
.tools button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.hint{font-size:.72rem;color:var(--muted);margin-top:10px;line-height:1.5}

/* ---- the document (A4 sheet) ---- */
.stage{display:flex;justify-content:center;overflow-x:auto}
.paper{background:var(--paper);color:var(--paper-fg);width:210mm;min-height:297mm;padding:14mm 13mm 12mm;
  box-shadow:0 10px 40px rgba(10,30,50,.18);font-size:10.3px;position:relative;display:flex;flex-direction:column}
@media(max-width:900px){.paper{width:100%;min-height:0;padding:7mm 6mm}}

.phead{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;align-items:start}
.phead .logo img{height:62px;width:auto;display:block}
.contact{margin-top:8px}
.contact .cn{font-weight:800;font-size:13px;color:var(--brand-ink);font-family:var(--f-display);margin-bottom:3px}
.contact .ci{display:flex;align-items:center;gap:6px;color:var(--paper-muted);font-size:9.6px;margin:1.5px 0}
.contact .ci img{width:12px;height:12px;opacity:.85}
.titlebox{text-align:right}
.titlebox .dt{font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:.06em;color:var(--brand);line-height:1}
.meta{margin-top:10px;display:inline-block;text-align:left;border:1px solid var(--paper-line);border-radius:6px;overflow:hidden;min-width:170px}
.meta div{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:4px 9px;font-size:9.8px}
.meta div+div{border-top:1px solid var(--paper-line)}
.meta b{color:var(--paper-muted);font-weight:600}
.meta span{text-align:right;font-weight:700}

.billbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;align-items:end}
.billto{border:1px solid var(--paper-line);border-radius:6px;padding:0;overflow:hidden;max-width:48%;justify-self:end;width:100%}
.billto .h{background:var(--brand);color:#fff;font-weight:700;font-size:9.6px;padding:4px 9px;letter-spacing:.03em}
.billto .b{padding:6px 9px;font-size:10px}
.billto .b .nm{font-weight:800;font-size:11.5px}
.billto .b div{margin:1px 0;color:var(--paper-fg)}

table.lines{width:100%;border-collapse:collapse;margin-top:14px;font-size:9.8px}
table.lines th{background:var(--brand);color:#fff;font-weight:700;padding:5px 7px;text-align:left;font-size:9.4px;letter-spacing:.02em}
table.lines th.num,table.lines td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.lines th.c,table.lines td.c{text-align:center}
table.lines td{padding:5px 7px;border-bottom:1px solid var(--paper-line);vertical-align:top}
table.lines tbody tr:nth-child(odd){background:#f4f9fd}
.desig .nm{font-weight:700}
.desig .mini{color:var(--paper-muted);font-size:9px}
.itcode{font-weight:800;color:var(--brand-ink)}

.totwrap{display:flex;justify-content:flex-end;margin-top:10px}
.totals{width:46%;min-width:230px}
.totals .r{display:grid;grid-template-columns:1fr auto;gap:10px;padding:4px 9px;font-size:10.2px}
.totals .r b{color:var(--paper-muted);font-weight:600}
.totals .r span{font-weight:700;font-variant-numeric:tabular-nums}
.totals .r.sub{border:1px solid var(--paper-line);border-bottom:0}
.totals .r.tva{border:1px solid var(--paper-line)}
.totals .r.ttc{background:var(--brand);color:#fff;border-radius:0 0 5px 5px;margin-top:0}
.totals .r.ttc b,.totals .r.ttc span{color:#fff;font-weight:800;font-size:11.5px}
.enlettres{margin-top:9px;font-size:9.8px;font-style:italic;color:var(--paper-fg)}
.enlettres b{font-style:normal;color:var(--paper-muted);font-weight:600}
.tee{margin-top:6px;font-size:9px;color:var(--paper-muted);border-left:2px solid var(--brand);padding-left:7px}
.fld select{width:100%;background:var(--input);border:1px solid var(--input-bd);border-radius:8px;padding:8px 10px;color:var(--fg);font-size:.95rem;font-family:var(--f-body)}

.modal{margin-top:16px;display:grid;grid-template-columns:1fr;gap:3px;font-size:9.8px}
.modal .mh{font-weight:800;color:var(--brand-ink);font-family:var(--f-display);font-size:11px;margin-bottom:3px}
.modal .mr{display:grid;grid-template-columns:150px 1fr;gap:6px}
.modal .mr b{color:var(--paper-muted);font-weight:600}
.note{margin-top:10px;font-size:9.6px;font-weight:700;color:var(--brand-ink)}

.spacer{flex:1}
.pfoot{margin-top:16px;border-top:2px solid var(--brand);padding-top:6px;font-size:7.8px;color:var(--paper-muted);text-align:center;line-height:1.5}
</style>

<div class="wrap">
  <!-- ============ EDIT PANEL ============ -->
  <section class="panel" aria-label="Éditeur">
    <h2>Document</h2>
    <div class="seg" role="group" aria-label="Type de document">
      <button id="tDevis" aria-pressed="true" onclick="setType('DEVIS')">Devis</button>
      <button id="tFacture" aria-pressed="false" onclick="setType('FACTURE')">Facture</button>
    </div>
    <div class="row2">
      <div class="fld"><label for="num">Numéro</label><input id="num" oninput="bind('number',this.value)"></div>
      <div class="fld"><label for="date">Date</label><input id="date" type="date" oninput="bind('date',this.value)"></div>
    </div>

    <h2 style="margin-top:6px">Client — Facturer à</h2>
    <div class="fld"><label for="cnm">Nom / Société</label><input id="cnm" oninput="bindC('name',this.value)"></div>
    <div class="row2">
      <div class="fld"><label for="cct">Contact</label><input id="cct" oninput="bindC('contact',this.value)"></div>
      <div class="fld"><label for="cph">Téléphone</label><input id="cph" oninput="bindC('phone',this.value)"></div>
    </div>

    <h2 style="margin-top:6px">Articles</h2>
    <div class="items" id="items"></div>
    <button class="addbtn" onclick="addItem()">+ Ajouter un article</button>

    <h2 style="margin-top:16px">Totaux & modalités</h2>
    <div class="fld"><label for="reg">Régime fiscal</label>
      <select id="reg" onchange="bind('regime',this.value)">
        <option value="TEE">Taxe d'État de l'Entreprenant (sans TVA)</option>
        <option value="TVA">Assujetti à la TVA</option>
      </select></div>
    <div class="row2">
      <div class="fld" id="tvaFld"><label for="tva">TVA (%)</label><input id="tva" type="number" step="0.1" oninput="bind('tva',parseFloat(this.value)||0)"></div>
      <div class="fld"><label for="dev">Devise</label><input id="dev" oninput="bind('currency',this.value)"></div>
    </div>
    <div class="fld"><label for="deliv">Délai de livraison</label><input id="deliv" oninput="bindM('delai',this.value)"></div>
    <div class="fld"><label for="pay">Mode de paiement</label><input id="pay" oninput="bindM('paiement',this.value)"></div>
    <div class="fld"><label for="note">Note</label><input id="note" oninput="bind('note',this.value)"></div>

    <div class="tools">
      <button class="primary" onclick="resetDoc()">Nouveau document</button>
      <button onclick="loadSample()">Exemple</button>
    </div>
    <p class="hint">💡 L'export PDF et l'impression sont disponibles dans l'application déployée sur Vercel (bouton « Imprimer / PDF »). Ici, l'aperçu se met à jour en direct et vos saisies sont mémorisées dans ce navigateur.</p>
  </section>

  <!-- ============ DOCUMENT ============ -->
  <section class="stage" aria-label="Aperçu du document">
    <article class="paper" id="paper"></article>
  </section>
</div>

const U=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
function deux(n,plural){
  if(n<20)return U[n];
  const d=Math.floor(n/10),u=n%10;
  if(d===7)return u===1?'soixante et onze':'soixante-'+U[10+u];
  if(d===9)return 'quatre-vingt-'+U[10+u];
  const t={2:'vingt',3:'trente',4:'quarante',5:'cinquante',6:'soixante',8:'quatre-vingt'}[d];
  if(n===80)return plural?'quatre-vingts':'quatre-vingt';
  if(u===0)return t;
  if(u===1&&d!==8)return t+' et un';
  return t+'-'+U[u];
}
function trois(n,plural){
  const c=Math.floor(n/100),r=n%100;
  if(c===0)return deux(r,plural);
  const cent=c===1?'cent':U[c]+' cent';
  if(r===0)return (c>1&&plural)?cent+'s':cent;
  return cent+' '+deux(r,plural);
}
function enLettres(n){
  n=Math.round(n);
  if(n===0)return 'zéro';
  const g=[]; let x=n;
  while(x>0){g.push(x%1000);x=Math.floor(x/1000);}   // g[0]=units, g[1]=mille, g[2]=million, g[3]=milliard
  const parts=[];
  if(g[3])parts.push((g[3]===1?'un':trois(g[3],true))+(g[3]>1?' milliards':' milliard'));
  if(g[2])parts.push((g[2]===1?'un':trois(g[2],true))+(g[2]>1?' millions':' million'));
  if(g[1])parts.push(g[1]===1?'mille':trois(g[1],false)+' mille');
  if(g[0])parts.push(trois(g[0],true));
  return parts.join(' ').trim();
}
function titre(s){return s.replace(/([a-zàâäéèêëïîôöùûüç])([a-zàâäéèêëïîôöùûüç']*)/gi,(m,a,b)=>a.toUpperCase()+b);}

/* ---------- bindings ---------- */
function bind(k,v){S[k]=v;save();render();}
function bindC(k,v){S.client[k]=v;save();renderPaper();}
function bindM(k,v){S.modal[k]=v;save();renderPaper();}
function setType(t){S.type=t;save();render();}
function addItem(){S.items.push(newItem());save();render();}
function delItem(i){S.items.splice(i,1);if(!S.items.length)S.items.push(newItem());save();render();}
function setItem(i,k,v){S.items[i][k]=(k==='qte'||k==='pu')?(parseFloat(v)||0):v;save();renderPaper();}
function resetDoc(){S=BLANK();save();render();}

function save(){try{localStorage.setItem('ecopump_doc',JSON.stringify(S));}catch(e){}}

function fmt(n){return (Math.round(n)||0).toLocaleString('fr-FR').replace(/ /g,' ');}
function frDate(iso){if(!iso)return'';const[y,m,d]=iso.split('-');return d+'/'+m+'/'+y;}

function esc(s){return String(s==null?'':s).replace(/"/g,'&quot;').replace(/</g,'&lt;');}

/* ---------- render document ---------- */
function renderPaper(){
  const isTEE=S.regime==='TEE';

  const lettres=titre(enLettres(ttc))+' '+(cur.replace('F CFA','Francs CFA').replace('FCFA','Francs CFA')||'Francs CFA');
  document.getElementById('paper').innerHTML=`
    <div class="phead">

        <div class="contact">

          <div class="ci"><span style="width:12px;text-align:center">🌐</span>${COMPANY.web}</div>
        </div>
      </div>
      <div class="titlebox">
        <div class="dt">${S.type}</div>
        <div class="meta">
          <div><b>N°</b><span>${esc(S.number)}</span></div>
          <div><b>Date</b><span>${frDate(S.date)}</span></div>
        </div>
      </div>
    </div>

    <div class="billbar">
      <div></div>
      <div class="billto">
        <div class="h">${S.type==='FACTURE'?'Facturer à :':'Devis pour :'}</div>
        <div class="b">
          <div class="nm">${esc(S.client.name)||'—'}</div>
          ${S.client.contact?`<div>${esc(S.client.contact)}</div>`:''}
          ${S.client.phone?`<div>${esc(S.client.phone)}</div>`:''}
        </div>
      </div>
    </div>

    <table class="lines">
      <thead><tr>
        <th class="c" style="width:7%">Item</th><th style="width:13%">REF</th>
        <th>Désignation</th><th class="c" style="width:7%">Qté</th>
        <th class="num" style="width:16%">PU (HT)</th><th class="num" style="width:16%">TOTAL (HT)</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>

    <div class="totwrap"><div class="totals">
      ${isTEE
        ? `<div class="r ttc"><b>TOTAL À PAYER :</b><span>${fmt(ttc)} ${cur}</span></div>`
        : `<div class="r sub"><b>SOUS-TOTAL :</b><span>${fmt(sub)} ${cur}</span></div>
           <div class="r tva"><b>TVA (${S.tva}%) :</b><span>${fmt(tva)} ${cur}</span></div>
           <div class="r ttc"><b>TOTAL TTC :</b><span>${fmt(ttc)} ${cur}</span></div>`}
    </div></div>
    <div class="enlettres"><b>Arrêté à la somme de :</b> ${lettres}.</div>
    ${isTEE?`<div class="tee">Montant non assujetti à la TVA — régime de la Taxe d'État de l'Entreprenant (TEE).</div>`:''}

    <div class="modal">
      <div class="mh">Modalités</div>
      <div class="mr"><b>Délai de livraison :</b><span>${esc(S.modal.delai)}</span></div>
      <div class="mr"><b>Mode de paiement :</b><span>${esc(S.modal.paiement)}</span></div>
    </div>
    ${S.note?`<div class="note">${esc(S.note)}</div>`:''}

    <div class="spacer"></div>
    <div class="pfoot">${COMPANY.legal}</div>`;
}
render();
